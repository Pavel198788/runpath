name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      - name: Проверка офлайн-манифеста PWA
        run: |
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          grep -q '"start_url"' dist/manifest.webmanifest
      - name: E2E — офлайн-режим и онбординг (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
