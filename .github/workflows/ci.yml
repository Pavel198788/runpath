name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, openssl, pdo_sqlite, curl
          tools: composer:v2
      - name: Установка зависимостей
        working-directory: server
        run: composer install --no-interaction --no-progress
      - name: Проверка синтаксиса PHP
        working-directory: server
        run: find src cron public -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Тесты API
        working-directory: server
        run: vendor/bin/phpunit

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      - name: Проверка офлайн-манифеста PWA
        run: |
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          grep -q '"start_url"' dist/manifest.webmanifest
      - name: E2E — офлайн-режим и онбординг (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
