<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RunPath — админка</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --card: #fff;
        --fg: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --accent: #f97316;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --card: #111a2e;
          --fg: #f1f5f9;
          --muted: #94a3b8;
          --border: #253352;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.5 system-ui,
          sans-serif;
      }
      .wrap {
        max-width: 900px;
        margin: 0 auto;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 14px;
      }
      h1 {
        font-size: 22px;
      }
      h2 {
        font-size: 17px;
        margin: 0 0 10px;
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      input,
      button {
        min-height: 44px;
        font-size: 15px;
        border-radius: 10px;
        border: 1px solid var(--border);
        padding: 8px 12px;
        background: var(--card);
        color: var(--fg);
        width: 100%;
      }
      button {
        background: var(--accent);
        color: #fff;
        border: 0;
        font-weight: 600;
        cursor: pointer;
      }
      button.ghost {
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--border);
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .row > * {
        flex: 1;
        min-width: 140px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 10px;
      }
      .stat {
        background: var(--bg);
        border-radius: 10px;
        padding: 10px;
      }
      .stat b {
        display: block;
        font-size: 24px;
      }
      .stat span {
        color: var(--muted);
        font-size: 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      td,
      th {
        text-align: left;
        padding: 8px 4px;
        border-bottom: 1px solid var(--border);
      }
      .err {
        color: #dc2626;
      }
      .ok {
        color: #16a34a;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>RunPath — админка</h1>

      <div class="card" id="login">
        <h2>Вход администратора</h2>
        <div class="row">
          <div>
            <label for="email">Почта</label><input id="email" type="email" autocomplete="email" />
          </div>
          <div>
            <label for="password">Пароль</label
            ><input id="password" type="password" autocomplete="current-password" />
          </div>
        </div>
        <p><button id="loginBtn">Войти</button></p>
        <p id="loginError" class="err"></p>
      </div>

      <div id="app" class="hidden">
        <div class="card">
          <h2>Статистика</h2>
          <div class="grid" id="stats"></div>
        </div>

        <div class="card">
          <h2>Настройки сервиса</h2>
          <div class="row">
            <div>
              <label for="aiDaily">Сообщений ИИ в день на человека</label
              ><input id="aiDaily" type="number" />
            </div>
            <div>
              <label for="aiBudget">Месячный бюджет ИИ, $</label
              ><input id="aiBudget" type="number" step="0.01" />
            </div>
            <div><label for="aiModel">Модель</label><input id="aiModel" /></div>
          </div>
          <p><button id="saveSettings">Сохранить</button></p>
          <p id="settingsMsg" class="ok"></p>
        </div>

        <div class="card">
          <h2>Пользователи</h2>
          <table>
            <thead>
              <tr>
                <th>Почта</th>
                <th>Создан</th>
                <th>Статус</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="users"></tbody>
          </table>
        </div>

        <p><button class="ghost" id="logout">Выйти</button></p>
      </div>
    </div>

    <script>
      // Админка лежит внутри public/, поэтому корень API — на уровень выше по пути.
      const API = location.pathname.replace(/\/admin\/.*$/, '')
      let token = sessionStorage.getItem('runpath_admin_token')

      const $ = (id) => document.getElementById(id)
      const api = async (path, options = {}) => {
        const res = await fetch(API + path, {
          method: options.method || 'GET',
          headers: {
            ...(options.body ? { 'content-type': 'application/json' } : {}),
            ...(token ? { authorization: 'Bearer ' + token } : {}),
          },
          ...(options.body ? { body: JSON.stringify(options.body) } : {}),
        })
        const json = await res.json().catch(() => ({}))
        if (!res.ok) throw new Error(json.message || 'Ошибка ' + res.status)
        return json
      }

      $('loginBtn').onclick = async () => {
        $('loginError').textContent = ''
        try {
          const res = await api('/v1/auth/login', {
            method: 'POST',
            body: { email: $('email').value, password: $('password').value },
          })
          token = res.accessToken
          sessionStorage.setItem('runpath_admin_token', token)
          await load()
        } catch (e) {
          $('loginError').textContent = e.message
        }
      }

      $('logout').onclick = () => {
        sessionStorage.removeItem('runpath_admin_token')
        location.reload()
      }

      $('saveSettings').onclick = async () => {
        await api('/v1/admin/settings', {
          method: 'PUT',
          body: {
            ai_daily_messages_per_user: Number($('aiDaily').value),
            ai_monthly_budget_usd: Number($('aiBudget').value),
            ai_model: $('aiModel').value,
          },
        })
        $('settingsMsg').textContent = 'Сохранено'
        setTimeout(() => ($('settingsMsg').textContent = ''), 2000)
      }

      const labels = {
        users: 'Пользователей',
        dau: 'Активных сегодня',
        wau: 'Активных за неделю',
        aiMessagesToday: 'Сообщений ИИ сегодня',
        aiCostMonth: 'Расход ИИ за месяц, $',
        pushSubscriptions: 'Подписок на push',
        stravaConnected: 'Подключено Strava',
        errorsWeek: 'Ошибок за неделю',
        documents: 'Документов',
        jobsPending: 'Заданий в очереди',
      }

      async function load() {
        try {
          const stats = await api('/v1/admin/stats')
          $('login').classList.add('hidden')
          $('app').classList.remove('hidden')
          $('stats').innerHTML =
            Object.entries(labels)
              .map(
                ([k, label]) =>
                  '<div class="stat"><b>' +
                  (stats[k] ?? 0) +
                  '</b><span>' +
                  label +
                  '</span></div>',
              )
              .join('') +
            '<div class="stat"><b>' +
            stats.funnel.k5 +
            '/' +
            stats.funnel.k10 +
            '/' +
            stats.funnel.half +
            '/' +
            stats.funnel.marathon +
            '</b><span>Дошли до 5/10/21/42 км</span></div>'

          const settings = await api('/v1/admin/settings')
          $('aiDaily').value = settings.ai_daily_messages_per_user
          $('aiBudget').value = settings.ai_monthly_budget_usd
          $('aiModel').value = settings.ai_model

          const { users } = await api('/v1/admin/users')
          $('users').innerHTML = users
            .map(
              (u) =>
                '<tr><td>' +
                u.email +
                '</td><td>' +
                (u.created_at || '').slice(0, 10) +
                '</td><td>' +
                (u.blocked_at ? 'заблокирован' : u.role === 'admin' ? 'админ' : 'активен') +
                '</td><td><button class="ghost" data-block="' +
                u.id +
                '" data-state="' +
                (u.blocked_at ? 'false' : 'true') +
                '">' +
                (u.blocked_at ? 'Разблокировать' : 'Заблокировать') +
                '</button></td></tr>',
            )
            .join('')
          document.querySelectorAll('[data-block]').forEach((btn) => {
            btn.onclick = async () => {
              await api('/v1/admin/users/' + btn.dataset.block + '/block', {
                method: 'POST',
                body: { blocked: btn.dataset.state === 'true' },
              })
              await load()
            }
          })
        } catch (e) {
          sessionStorage.removeItem('runpath_admin_token')
          token = null
          $('loginError').textContent = e.message
        }
      }

      if (token) load()
    </script>
  </body>
</html>
